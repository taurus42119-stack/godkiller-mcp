[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "godkiller-mcp"
version = "1.6.0"
description = "GODKILLER MCP — Antigravity phase/evidence orchestrator with code, scan, and browser facades"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "GODKILLER Team" }
]
dependencies = [
    "mcp>=1.0.0",
    "pytest>=8.0.0",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
scrape = ["beautifulsoup4>=4.12.0"]
browser = ["playwright>=1.40.0"]
all = ["beautifulsoup4>=4.12.0", "playwright>=1.40.0"]

[project.scripts]
godkiller-mcp = "godkiller_mcp.server:main"

[project.urls]
Homepage = "https://github.com/taurus42119-stack/godkiller-mcp"
Repository = "https://github.com/taurus42119-stack/godkiller-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
godkiller_mcp = ["protocols/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/gauntlet"]
pythonpath = ["src", "."]
