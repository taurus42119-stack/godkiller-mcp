[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "godkiller-mcp"
version = "1.0.1"
description = "GODKILLER MCP Server - local quality-control and engineering toolkit for LLM coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "GODKILLER Team" }
]
dependencies = [
    "mcp>=1.0.0",
    "pytest>=8.0.0",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
scrape = ["beautifulsoup4>=4.12.0"]

[project.scripts]
godkiller-mcp = "godkiller_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
